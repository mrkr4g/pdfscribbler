<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PDF Scribbler</title>

  </head>
  <body>
    <p id="selectedFile">No file selected.</p>
    <button id="openPdfButton">Open PDF</button>
    <button id="fitWidthButton" disabled>Fit Width</button>
    <button id="fitHeightButton" disabled>Fit Height</button>
    <button id="savePageButton" type="button" disabled>Save This Page</button>
    <button id="saveAndCloseButton" type="button" disabled>Save Page and Close</button>

<a id="saveStatus" href="#"></a>
    <div id="stampChooser">
      
     
      <div id="stampThumbnailRow"></div>
    <button id="addStampButton">New Stamp</button>
    <button id="removeStampButton" type="button" disabled>Remove from Library</button>
     
    </div>
    <hr>
    <div id="pdfWorkspace">

      <div id="thumbnailPanel"></div>
    
      <div id="mainViewer">
        <div id="loadingIndicator" role="status" aria-live="polite" hidden>
          <div class="loadingSpinner" aria-hidden="true"></div>
            <span>Loading PDF...</span>
        </div>
        <div id="pageCanvasContainer">

        <canvas id="pdfCanvas"></canvas>
        <canvas id="stampCanvas"></canvas>
          </div>
      </div>
    
    </div>

    <dialog
      id="freeTextDialog"
      aria-labelledby="freeTextDialogTitle"
    >
      <form id="freeTextForm">
        <h2 id="freeTextDialogTitle">
          Free Text
        </h2>

        <label for="freeTextInput">
          Text to place
        </label>

        <input
          id="freeTextInput"
          name="freeText"
          type="text"
          maxlength="80"
          autocomplete="off"
          required
        />

        <div class="free-text-dialog-actions">
          <button
            id="freeTextCancelButton"
            type="button"
          >
            Cancel
          </button>

          <button type="submit">
            Use Text
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
