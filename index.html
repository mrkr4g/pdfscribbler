<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PDF Scribbler</title>

  </head>
  <body>
    <p id="selectedFile">No file selected.</p>

    <div
      id="topToolbar"
      role="toolbar"
      aria-label="PDF actions"
    >
      <button
        id="openPdfButton"
        type="button"
        title="Open PDF"
        aria-label="Open PDF"
      ></button>
    
      <button
        id="fitWidthButton"
        type="button"
        title="Fit page to width"
        aria-label="Fit page to width"
        disabled
      ></button>
    
      <button
        id="fitHeightButton"
        type="button"
        title="Fit page to height"
        aria-label="Fit page to height"
        disabled
      ></button>
    
      <button
        id="savePageButton"
        type="button"
        title="Save active page"
        aria-label="Save active page"
        disabled
      ></button>
    
      <button
        id="saveAndCloseButton"
        type="button"
        disabled
      >
        Save Page and Close
      </button>
    
      <button
        id="saveEncryptedButton"
        type="button"
        title="Save encrypted PDF"
        aria-label="Save encrypted PDF"
        disabled
      >
        Save Encrypted
      </button>
    </div>
    
    <a id="saveStatus" href="#"></a>
    
    <div id="stampChooser">
      <div
        id="dynamicTextButtonRow"
        role="toolbar"
        aria-label="Dynamic text stamps"
      ></div>
    
      <div
        id="stampThumbnailRow"
        aria-label="Image stamps"
      ></div>
    
      <button
        id="addStampButton"
        type="button"
        title="Add new image stamp"
        aria-label="Add new image stamp"
      ></button>
    
      <button
  id="removeStampButton"
  type="button"
  title="Remove selected stamp from library"
  aria-label="Remove selected stamp from library"
  disabled
></button>
    </div>
    
      
    </div>
    <hr>
    <div id="pdfWorkspace">

      <div id="thumbnailPanel"></div>
    
      <div id="mainViewerShell">
        <div id="zoomControls">
          <button
            id="zoomOutButton"
            type="button"
            title="Zoom out"
            aria-label="Zoom out"
            disabled
          ></button>
          <button
            id="zoomInButton"
            type="button"
            title="Zoom in"
            aria-label="Zoom in"
            disabled
          ></button>
        </div>
        <div id="loadingIndicator" role="status" aria-live="polite" hidden>
          <div class="loadingSpinner" aria-hidden="true"></div>
            <span>Loading PDF...</span>
        </div>
        <div id="mainViewer">
          <div id="pageCanvasContainer">

          <canvas id="pdfCanvas"></canvas>
          <canvas id="stampCanvas"></canvas>
            </div>
        </div>
      </div>
    
    </div>

    <dialog
      id="freeTextDialog"
      aria-labelledby="freeTextDialogTitle"
    >
      <form id="freeTextForm">
        <h2 id="freeTextDialogTitle">
          Free Text
        </h2>

        <label for="freeTextInput">
          Text to place
        </label>

        <input
          id="freeTextInput"
          name="freeText"
          type="text"
          maxlength="80"
          autocomplete="off"
          required
        />

        <div class="free-text-dialog-actions">
          <button
            id="freeTextCancelButton"
            type="button"
          >
            Cancel
          </button>

          <button type="submit">
            Use Text
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
